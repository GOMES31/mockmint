openapi: 3.0.3
info:
  title: Petstore
  version: "1.0"
  description: Sample mockmint package. See mockmint.yaml for dispatch rules and behaviors.
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [available, sold]}
          examples:
            sold: {value: sold}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        "200":
          description: A list of pets.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Pet"}
              examples:
                all:
                  value:
                    - {id: 1, name: Tom, kind: cat, status: available}
                    - {id: 2, name: Rex, kind: dog, status: available}
                    - {id: 3, name: Nemo, kind: fish, status: sold}
                sold:
                  value:
                    - {id: 3, name: Nemo, kind: fish, status: sold}
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewPet"}
      responses:
        "201":
          description: Created.
          headers:
            X-Created-Name:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Pet"}
        "422":
          description: Rejected.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: {type: integer, minimum: 1}
        examples:
          tom: {value: 1}
          rex: {value: 2}
    get:
      operationId: getPet
      responses:
        "200":
          description: A pet.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Pet"}
              examples:
                tom: {value: {id: 1, name: Tom, kind: cat, status: available}}
                rex: {value: {id: 2, name: Rex, kind: dog, status: available}}
        "404":
          description: Not found.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
              examples:
                missing:
                  value: {type: "about:blank", title: Not Found, status: 404, detail: No such pet.}
    delete:
      operationId: deletePet
      responses:
        "204": {description: Deleted.}
  /orders/{orderId}/status:
    get:
      operationId: getOrderStatus
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Order status progression.
          content:
            application/json:
              schema:
                type: object
                required: [orderId, status]
                properties:
                  orderId: {type: string}
                  status: {type: string, enum: [placed, approved, delivered]}
components:
  schemas:
    NewPet:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        kind: {type: string, enum: [cat, dog, fish, bird]}
        tag: {type: string}
    Pet:
      allOf:
        - {$ref: "#/components/schemas/NewPet"}
        - type: object
          required: [id]
          properties:
            id: {type: integer, minimum: 1}
            status: {type: string, enum: [available, pending, sold]}
            createdAt: {type: string, format: date-time}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
