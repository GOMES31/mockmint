operation: createPet
examples:
  created:
    response:
      status: 201
      headers:
        X-Created-Name: "{{.Request.Body.name}}"
      body: |
        {"id": {{.RandInt 100 999}}, "name": {{json .Request.Body.name}}, "kind": {{json .Request.Body.kind}}, "status": "available", "createdAt": "{{.Timestamp}}"}
  no-birds:
    request:
      body: {kind: bird}
    response:
      status: 422
      mediaType: application/problem+json
      body: {type: "about:blank", title: Unprocessable Entity, status: 422, detail: Birds are not supported.}
