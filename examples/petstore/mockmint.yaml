# Mounted at /petstore/1.0 (name/version default to the spec's info).
validation: strict
seed: 42                        # deterministic templates, latency and faults
clock: 2025-01-01T12:00:00Z     # frozen {{.Now}}

behavior:
  latency: {min: 5ms, max: 25ms}

operations:
  # Default "auto" dispatch pairs examples by name: GET /pets/1 → tom, /pets/2 → rex.
  getPet:
    fallback: {example: missing}      # any other id → 404 example

  listPets:
    dispatcher:
      type: query_params
      rules:
        - when: {status: sold}
          example: sold
      default: all

  createPet:
    dispatcher:
      type: body_jsonpath
      rules:
        - when: {"$.kind": bird}
          example: no-birds
      default: created

  getOrderStatus:
    dispatcher:
      type: sequence
      examples: [placed, approved, delivered]
    behavior:
      rateLimit: {rps: 5, burst: 10}

  deletePet:
    behavior:
      faults:
        - {probability: 0.1, status: 503}
