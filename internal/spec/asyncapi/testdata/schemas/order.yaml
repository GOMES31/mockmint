type: object
required: [id, items]
properties:
  id: {type: string, format: uuid}
  total: {type: number, minimum: 0}
  items:
    type: array
    minItems: 1
    items: {$ref: "#/$defs/item"}
$defs:
  item:
    type: object
    required: [sku]
    properties:
      sku: {type: string}
      qty: {type: integer, minimum: 1, maximum: 9}
